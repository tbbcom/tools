<section class="tbbx-cc-wrap" data-lang="en">

  <div class="tbbx-cc-head">

    <h2 class="tbbx-cc-title">Loading…</h2>

    <div class="tbbx-lang">

      <button type="button" data-lang="en" aria-pressed="true">EN</button>

      <button type="button" data-lang="ms" aria-pressed="false">BM</button>

    </div>

  </div>

  <div class="tbbx-cc-card" role="group" aria-label="Currency converter">

    <div class="tbbx-cc-grid">

      <label class="tbbx-cc-field"><span class="tbbx-cc-label tbbx-label-amount">Amount</span>

        <input class="tbbx-cc-input tbbx-amt" type="number" step="any" min="0" inputmode="decimal" placeholder="100" aria-describedby="tbbx-help-en"></label>

      <label class="tbbx-cc-field"><span class="tbbx-cc-label tbbx-label-from">From</span>

        <select class="tbbx-cc-select tbbx-from" aria-label="From currency"></select></label>

      <label class="tbbx-cc-field"><span class="tbbx-cc-label tbbx-label-to">To</span>

        <select class="tbbx-cc-select tbbx-to" aria-label="To currency"></select></label>

      <div class="tbbx-cc-actions">

        <button class="tbbx-btn tbbx-primary tbbx-convert" type="button">Convert</button>

        <button class="tbbx-btn tbbx-ghost tbbx-swap" type="button" title="Swap">⇄</button>

      </div>

    </div>

    <div class="tbbx-cc-quick"><span class="tbbx-quick-label">Quick:</span>

      <button class="tbbx-chip" data-amt="10">10</button>

      <button class="tbbx-chip" data-amt="50">50</button>

      <button class="tbbx-chip" data-amt="100">100</button>

      <button class="tbbx-chip" data-amt="1000">1,000</button>

    </div>

    <div class="tbbx-favs"><strong class="tbbx-favs-label">Favorites:</strong>

      <!-- favorites appear here -->

      <button class="tbbx-fav tbbx-addfav" type="button">Add Pair</button>

    </div>

    <output class="tbbx-cc-out tbbx-out" role="status" aria-live="polite">—</output>

    <div class="tbbx-cc-meta">

      <span class="tbbx-rateinfo">—</span>

      <div class="tbbx-cc-share">

        <button class="tbbx-btn tbbx-outline tbbx-copy" type="button">Copy</button>

        <button class="tbbx-btn tbbx-outline tbbx-share" type="button">Share</button>

      </div>

    </div>

    <details class="tbbx-cc-adv"><summary>Options</summary>

      <div class="tbbx-cc-advgrid">

        <label class="tbbx-cc-field"><span class="tbbx-cc-label tbbx-provider-label">Provider</span>

          <select class="tbbx-cc-select tbbx-provider">

            <option value="host">Frankfurter</option>

            <option value="frank">Frankfurter</option>

            <option value="auto" selected>Auto (Best)</option>

          </select></label>

        <label class="tbbx-cc-check"><input class="tbbx-cache" type="checkbox" checked>

          <span class="tbbx-cache-label">Cache rates in this browser</span></label>

        <label class="tbbx-cc-check"><input class="tbbx-invert" type="checkbox">

          <span class="tbbx-invert-label">Show inverse rate</span></label>

      </div>

    </details>

    <div class="tbbx-history">

      <button class="tbbx-btn tbbx-outline tbbx-history-btn" type="button">30d chart</button>

      <canvas class="tbbx-spark" aria-hidden="true"></canvas>

    </div>

    <p id="tbbx-help-en" class="tbbx-cc-help">Client-side only. ISO-accurate rounding. No tracking.</p>

  </div>
</section>
